<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Layout</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        html{
            margin: 0;
            padding: 0;
        }
        body{
            text-align: center;
            background-color: antiquewhite;
        }
        main{
            width: 960px;
            height: auto;
            background-color: rgb(227, 141, 35);
            margin: 0 auto;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        header{
            width: 960px;
            height: 100px;
            background-color: #CCC;
        }
        nav{
            width: 960px;
            height: 80px;
            background-color: #CCC;
        }
        section{
            width: 960px;
            height: 400px;
            /* background-color: #CCC; */
            display: flex;
            flex-direction: row;
            column-gap: 10px;
        }
        #left{
            flex-grow: 1;
            background-color: #999;
        }
        #right{
            flex-grow: 2;
            /* background-color: #777; */
            display: flex;
            flex-direction: column;
            row-gap: 10px;
        }
        aside,article{
            background-color: #ecd1d1;
            height: 50px;
            flex-grow: 1;
        }
        footer{
            width: 960px;
            height: 300px;
            background-color: #CCC;
        }
    </style>
</head>
<body>
    <!-- main start -->
    <main>

        <!-- header -->
        <header>
            <h2>header</h2>
        </header>

        <!-- nav -->
        <nav>
           <h2>Navbar</h2>
        </nav>

        <!-- section -->
        <section>
            <div id="left">

            </div>
            <div id="right">
                <aside>
                    <h2>Aside</h2>
                </aside>

                <article>
                    <h2>Article</h2>
                </article>
            </div>
        </section>

        <!-- footer -->
        <footer>
            <h2>footer</h2>
        </footer>

    </main>
</body>
</html>
